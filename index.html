<script>
    const audio = document.getElementById('musicaFondo');
    const overlay = document.getElementById('overlay');

    // Función para iniciar la música con la pantalla de bienvenida
    function iniciarPagina() {
      const tiempoGuardado = localStorage.getItem('tiempoCancion');
      if (tiempoGuardado) {
        audio.currentTime = parseFloat(tiempoGuardado);
      }

      if (audio) {
        audio.play().catch(err => console.log(err));
      }
      
      overlay.style.transition = 'opacity 0.5s ease';
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }

    // Guarda el segundo exacto de la canción mientras suena
    audio.addEventListener('timeupdate', () => {
      localStorage.setItem('tiempoCancion', audio.currentTime);
    });

    // PAUSA LA MÚSICA DE INMEDIATO AL HACER CLIC EN CUALQUIER BOTÓN
    document.querySelectorAll('.btn-open').forEach(boton => {
      boton.addEventListener('click', (e) => {
        audio.pause();
      });
    });

    // SI REGRESA A LA PESTAÑA DEL MENÚ, LA MÚSICA VUELVE A SONAR
    window.addEventListener('focus', () => {
      if (overlay.style.display === 'none') {
        const tiempoGuardado = localStorage.getItem('tiempoCancion');
        if (tiempoGuardado) {
          audio.currentTime = parseFloat(tiempoGuardado);
        }
        audio.play().catch(err => console.log(err));
      }
    });
  </script>
